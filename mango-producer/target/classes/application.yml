server:
  port: 8004

spring:
  application:
    name: mango-producer
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        health-check-interval: 30s
        health-check-path: /actuator/health
        health-check-timeout: 5s
        register: true

  boot:
    admin:
      client:
        url: http://localhost:8000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
